<html>
<head>
    <title>validation Form</title>
    <style>
body {
    font-family: Arial;
    background: #f4f6f8;
}

form {
    width: 350px;
    margin: 80px auto;
    padding: 18px;
    background: #fff;
    border: 3px solid #b4c0d3;
    border-radius: 6px;
}

h2 {
    text-align: center;
    color: #2b3e5f;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 10px;
}

input {
    width: 300px;
    padding: 6px;
    border: 3px solid #b4c0d3;
    border-radius:6px;
}

button {
    width: 80px;
    padding: 6px;
    color: #fff;
    border: none;
    border-radius: 4px;
    margin-top: 12px;
    cursor: pointer;
}

button[type=submit] { background: #39ca49; }
button[type=reset] { background: #e84c3d; }


    </style>
    <script>
        function validate() {
            var name = document.getElementById("nam").value;
            var passwd = document.getElementById("pwd").value;
            var confirmpass = document.getElementById("cfmpwd").value;
            var phone = document.getElementById("pno").value;

            if (name == "") {
                alert('Name cannot be blank');
                return false;
            } else if (!isNaN(name)) {
                alert('Name must contain alphabets only');
                return false;
            } else if (passwd == "") {
                alert('Enter a Password');
                return false;
            } else if (passwd.length < 8) {
                alert('Password requires at least 8 characters');
                return false;
            } else if (confirmpass == "") {
                alert('Please confirm your password');
                return false;
            } else if (passwd !== confirmpass) {
                alert('Passwords do not match');
                return false;
            } else if (phone == "") {
                alert('Enter your phone number!');
                return false;
            } else if (isNaN(phone)) {
                alert('Invalid Phone Number');
                return false;
            } else if (phone.length != 10) {
                alert('Not a Valid Phone Number (need 10 digits)');
                return false;
            } else {
                alert('Thank You for Registration');
                return true;
            }
        }
    </script>
</head>
<body>
    <form onsubmit="return validate()">
        <h2>Form Validation</h2>
        <form style="width:900px;">
            <label>Name</label>
            <input type="text" placeholder="Name" id="nam"><br><br>

            <label>Password</label>
            <input type="password" id="pwd"><br><br>

            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm Password" id="cfmpwd"><br><br>

            <label>Phone Number</label>
            <input type="text" placeholder="Phone Number" id="pno"><br><br>

            <button type="submit">Submit</button>
            <button type="reset">Cancel</button>
        </form>
</body>
</html>
