<!DOCTYPE html>
<html>
<head>
<title>Changing image and text</title>
<style>
body {
  background: linear-gradient(135deg, #ffe6f2, #e6f7ff);
  display: flex;
  flex-direction: column;
  justify-content: center; 
  align-items: center;    
  height:100vh;          
  margin: 0;
  font-family: Arial, sans-serif;
}

h1 {
  font-size: 50px;
  color: #c2185b;
  text-shadow: 2px 2px 5px rgba(0,0,0,0.2);
  margin-bottom: 20px;
}

img {
  width: 350px;   /* fixed width */
  height: 350px;  /* fixed height */
  border: 5px solid green;
  border-radius: 50%;
  object-fit: cover; /* keeps shape perfect */
  box-shadow: 0px 4px 12px rgba(0,0,0,0.2);
}


#p1 {
  font-size: 35px;
  margin-top: 20px;
  font-weight: bold;
  color: #333;
}
</style>

<script>
function one() {
  document.getElementById("img").src = "rose1.jpg";
  document.getElementById("p1").innerHTML = "On Mouse Over!";
  document.getElementById("p1").style.color = "violet";
}

function two() {
  document.getElementById("img").src = "rose2.jpg";
  document.getElementById("p1").innerHTML = "On Mouse Out!";
  document.getElementById("p1").style.color = "red";
}
</script>
</head>

<body>
<h1>Roses For You 🌹</h1>
<img src="rose3.jpg" id="img" onmouseover="one()" onmouseout="two()">
<p id="p1">Move your mouse over the image!</p>

</body>
</html>
