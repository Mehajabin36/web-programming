<html>
<head>
    <title>JavaScript String and Math Methods</title>
</head>
<body>
    <h2>String Functions</h2>
    <script>
        let s2 = 'Javascript';
        document.write(s2, "<br>");

        var s1 = "Welcome to JS Programming";
        document.write(s1, "<br>");

        let s = "Javascript Programming";
        document.write(s, "<br>");

        document.write("Slice(0,7): ", s1.slice(0, 7), "<br>");
        document.write("Slice(10): ", s1.slice(10), "<br>");
        document.write("Slice(-11,-1): ", s1.slice(-11, -1), "<br>");
        document.write("Substring(0,12): ", s1.substring(0, 12), "<br>");
        document.write("Substr(0,10): ", s1.substr(0, 10), "<br>");
        document.write("Replace(): ", s1.replace("JS", "Java Script"), "<br>");

        let st = "js Welcome to js Programming";
        let newstr = st.replace(/js/g, "Javascript");
        document.write("replace with JS → Javascript: ", newstr, "<br>");

        let newtext = st.replace(/js/g, (match) => match.toUpperCase());
        document.write("replace with JS uppercase: ", newtext, "<br>");

        let t = st.replaceAll("js", "Javascript");
        document.write("replaceAll: ", t, "<br>");

        var a = [10, 20, 30, 40];
        document.write("Type of the array: ", typeof a, "<br>");
        document.write("The elements in the array are: ", a.join(", "), "<br>");
        document.write("The element at the last of array is: ", a[a.length - 1], "<br>");
        
        var a = [6, 5, 4, 3, 2, 1, 9];
        document.write("The elements in the array are:<br>");
        for (var i = 0; i < a.length; i++) {
            document.write(a[i], " ");
        }
        document.write("<br><h2>Math Functions</h2>");

        document.write("Absolute value of -5 is: ", Math.abs(-5), "<br>");
        document.write("Cube root of 27 is: ", Math.cbrt(27), "<br>");
        document.write("Round up 2.45: ", Math.ceil(2.45), "<br>");
        document.write("Exponential e^3: ", Math.exp(3), "<br>");
        document.write("2 to the power 3 is: ", Math.pow(2, 3), "<br>");
        document.write("Minimum of 5, 2 and 1 is: ", Math.min(5, 2, 1), "<br>");
        document.write("Maximum of 7, 10, 3 and 1 is: ", Math.max(7, 10, 3, 1), "<br>");
        document.write("Square root of 25 is: ", Math.sqrt(25), "<br>");
        document.write("Truncated value of 4.56 is: ", Math.trunc(4.56), "<br>");
        document.write("Rounded value of 6.2 is: ", Math.round(6.2), "<br>");
        document.write("Random number is: ", Math.random(), "<br>");
    </script>
</body>
</html>
